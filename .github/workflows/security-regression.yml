name: Security Regression

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"   # daily, to catch drift even without code changes

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check lab tests

      - name: Unit + integration tests
        run: pytest --cov=lab --cov-report=term-missing --cov-fail-under=85

      - name: Run the attack/defence harness (fails on any missed detection)
        env:
          RBL_FAIL_UNDER: "100"
        run: python -m lab.runner

      - name: Upload detection-coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-report
          path: |
            report.html
            report.json
