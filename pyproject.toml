[project]
name = "red-blue-lab"
version = "0.1.0"
description = "An automated attack/defence security-regression harness with a detection-coverage gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vincent Plessy", email = "vincent.plessy12@gmail.com" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["lab"]
